name = "OCPP"
version = "0.1.0"
description = "Run an OCPP 1.6 and 2.0.1 central system (CSMS): EV charge points connect over WebSocket and their meter values, connector status and sessions become signals. Remote start and stop, reset and firmware update."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-extension-ocpp"
# At most 20 keywords and 10 categories. Marketplace search matches both, the name, description,
# author and repository. Zelos AI sees the name, description and keywords, not the categories.
keywords = ["ocpp", "ev-charging", "evse", "ev", "charging-station", "ocpp-j", "ocpp 1.6", "ocpp 2.0.1", "ocpp16", "ocpp201", "open charge point protocol", "csms", "central system", "charge point", "charging station", "ev charger", "websocket", "wss", "tls", "meter values"]
categories = ["Energy", "IoT", "Networking", "Automotive"]
icon = "assets/icon.png"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[config]
schema = "config.schema.json"

[agent]
runtime = "python"
entry = "main.py"
python_version = "3.11"

[package]
paths = ["LICENSE", "main.py", "zelos_extension_ocpp"]
