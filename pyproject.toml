[project]
name = "zelos-extension-ocpp"
version = "0.1.0"
description = "Run an OCPP 1.6 and 2.0.1 central system (CSMS): EV charge points connect over WebSocket and their meter values, connector status and sessions become signals. Remote start and stop, reset and firmware update."
authors = [{ name = "Zelos", email = "support@zeloscloud.io" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["zelos", "extension", "ocpp", "ev-charging", "evse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "zelos-sdk>=0.0.13a1",
    "ocpp>=2.0.0",
    "websockets>=13.0",
    "rich-click>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/zeloscloud/zelos-extension-ocpp"
Repository = "https://github.com/zeloscloud/zelos-extension-ocpp"
Issues = "https://github.com/zeloscloud/zelos-extension-ocpp/issues"
Documentation = "https://docs.zeloscloud.io/app/extensions/"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.5"

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_ocpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--log-cli-level=INFO"

[tool.ruff]
target-version = 'py311'
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "B008",   # function call in defaults (common in decorators)
]
